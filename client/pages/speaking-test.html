<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speaking Test - IELTS Prep</title>
  <meta name="description" content="Record your IELTS speaking response and get instant AI-powered evaluation.">
  <script>if(localStorage.theme==='dark'||(!('theme' in localStorage)&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased h-screen flex flex-col selection:bg-brand-500 selection:text-white transition-colors duration-200">
  
  <!-- Header -->
  <header class="bg-white/85 dark:bg-slate-900/85 backdrop-blur-lg border-b border-slate-200 dark:border-slate-800 h-16 flex items-center px-6 shrink-0 z-10 shadow-sm">
    <div class="flex items-center gap-4 flex-1">
      <a href="speaking.html" class="p-2 -ml-2 text-slate-500 hover:text-slate-900 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition group">
        <svg class="w-5 h-5 transition-transform group-hover:-translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </a>
      <div>
        <h1 class="font-display font-semibold text-lg" id="test-title">Speaking Test</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Record your response and submit for AI evaluation</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="rec-status" class="hidden items-center gap-2 px-3 py-1.5 rounded-full bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
        Recording
      </span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-6 md:p-12">
    <div class="max-w-3xl mx-auto space-y-10">
      
      <!-- Prompt Card (Glassmorphic) -->
      <div class="speaking-glass rounded-2xl p-6 md:p-8 text-center space-y-4 page-enter">
        <span class="inline-block px-3 py-1 bg-brand-100 dark:bg-brand-900/30 text-brand-700 dark:text-brand-300 rounded-full text-xs font-semibold tracking-wide uppercase" id="part-badge">Part 2</span>
        <h2 class="text-xl md:text-2xl lg:text-3xl font-medium leading-relaxed text-slate-800 dark:text-slate-100" id="prompt-text">Loading prompt...</h2>
        <p class="text-xs text-slate-400 dark:text-slate-500 max-w-md mx-auto">Read the prompt carefully. When ready, press the microphone button to start recording your response.</p>
      </div>

      <!-- Recording Area -->
      <div class="flex flex-col items-center justify-center space-y-6 speak-state" id="recording-area">
        
        <!-- Waveform Visualizer -->
        <div class="waveform-wrap w-full max-w-lg" id="waveform-container">
          <canvas id="waveform-canvas"></canvas>
        </div>

        <!-- Record Button -->
        <div class="relative flex items-center justify-center">
          <div id="recording-indicator" class="absolute inset-0 bg-red-500 rounded-full recording-ring hidden"></div>
          <button id="btn-record" class="relative z-10 w-20 h-20 bg-brand-600 hover:bg-brand-700 text-white rounded-full shadow-lg shadow-brand-500/30 transition-all active:scale-95 flex items-center justify-center group hover:shadow-xl hover:shadow-brand-500/40">
            <svg id="icon-mic" class="w-8 h-8 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
            <svg id="icon-stop" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>

        <!-- Timer -->
        <div id="timer" class="text-4xl font-display font-bold text-slate-400 dark:text-slate-500 font-mono tabular-nums transition-all">00:00</div>

        <!-- Instruction hint -->
        <p id="record-hint" class="text-sm text-slate-400 dark:text-slate-500 flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Tap the microphone to begin recording
        </p>
      </div>

      <!-- Post-Recording Actions -->
      <div id="post-recording-actions" class="hidden space-y-6 w-full max-w-lg mx-auto speak-state page-enter">
        <div class="card p-4">
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Your Recording</p>
          <audio id="audio-playback" controls class="w-full h-12 rounded-lg"></audio>
        </div>
        <div class="flex gap-3">
          <button id="btn-retake" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-medium transition text-sm">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Retake
          </button>
          <button id="btn-submit" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-medium shadow-md shadow-brand-500/20 hover:shadow-lg hover:shadow-brand-500/30 transition text-sm">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Submit for Evaluation
          </button>
        </div>
      </div>

    </div>
  </main>
  
  <script type="module" src="../js/pages/speaking-test.js"></script>
</body>
</html>
