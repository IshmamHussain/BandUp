<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account · BandUp IELTS</title>
  <script>if(localStorage.theme==='dark'||(!('theme' in localStorage)&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">

  <main class="min-h-screen grid place-items-center p-4 page-enter">
    <div class="w-full max-w-md">
      <a href="/" class="flex items-center justify-center gap-2.5 mb-8">
        <span class="grid place-items-center w-10 h-10 rounded-xl bg-gradient-to-br from-brand-600 to-cyan-500 text-white font-display font-bold">B</span>
        <span class="font-display font-bold text-2xl">BandUp</span>
      </a>

      <div class="card p-8">
        <h1 class="font-display font-bold text-2xl mb-1">Create your account</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Free to start. Your AI examiner is waiting.</p>

        <form id="register-form" class="space-y-4" novalidate>
          <div>
            <label for="name" class="block text-sm font-medium mb-1.5">Full name</label>
            <input id="name" name="name" type="text" required autocomplete="name" maxlength="100"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900
                     placeholder-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition"
              placeholder="Your name">
          </div>
          <div>
            <label for="email" class="block text-sm font-medium mb-1.5">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900
                     placeholder-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition"
              placeholder="you@example.com">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium mb-1.5">Password</label>
            <input id="password" name="password" type="password" required autocomplete="new-password"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900
                     placeholder-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition"
              placeholder="At least 8 characters">
            <ul class="flex gap-4 mt-2 text-xs text-slate-500 dark:text-slate-400">
              <li id="req-length" class="flex items-center gap-1"><span class="req-dot inline-block w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>8+ characters</li>
              <li id="req-letter" class="flex items-center gap-1"><span class="req-dot inline-block w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>a letter</li>
              <li id="req-number" class="flex items-center gap-1"><span class="req-dot inline-block w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>a number</li>
            </ul>
          </div>

          <p id="form-error" class="hidden text-sm text-red-600 dark:text-red-400" role="alert"></p>

          <button id="submit-btn" type="submit"
            class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-semibold
                   transition disabled:opacity-60 disabled:cursor-not-allowed">
            Create account
          </button>
        </form>
      </div>

      <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
        Already have an account?
        <a href="/pages/login.html" class="font-semibold text-brand-600 dark:text-brand-400 hover:underline">Log in</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { api } from '/js/api.js';

    const form = document.getElementById('register-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const password = document.getElementById('password');

    // Live password requirement hints
    const checks = [
      { el: document.getElementById('req-length'), test: (v) => v.length >= 8 },
      { el: document.getElementById('req-letter'), test: (v) => /[a-zA-Z]/.test(v) },
      { el: document.getElementById('req-number'), test: (v) => /[0-9]/.test(v) },
    ];
    password.addEventListener('input', () => {
      for (const { el, test } of checks) {
        const passes = test(password.value);
        el.querySelector('.req-dot').className =
          `req-dot inline-block w-1.5 h-1.5 rounded-full ${passes ? 'bg-brand-500' : 'bg-slate-300 dark:bg-slate-600'}`;
        el.classList.toggle('text-brand-600', passes);
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await api.register({
          name: form.name.value.trim(),
          email: form.email.value.trim(),
          password: form.password.value,
        });
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
