<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary · BandUp IELTS</title>
  <script>if(localStorage.theme==='dark'||(!('theme' in localStorage)&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">

  <div class="md:pl-64 min-h-screen flex flex-col">
    <header id="topbar"></header>

    <main class="flex-1 p-4 sm:p-6 max-w-4xl w-full mx-auto page-enter">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
        <div>
          <h2 class="font-display font-bold text-2xl sm:text-3xl">Vocabulary builder</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Band 7–9 words. Flip the card, then rate how well you know it.</p>
        </div>
        <div class="flex rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden text-sm font-semibold" role="tablist">
          <button id="mode-cards" role="tab" aria-selected="true" class="px-4 py-2 bg-brand-600 text-white">Flashcards</button>
          <button id="mode-quiz" role="tab" aria-selected="false" class="px-4 py-2 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition">Quiz</button>
        </div>
      </div>

      <!-- Filters -->
      <div id="filters" class="flex flex-wrap items-center gap-2 mb-6"></div>

      <!-- ===== Flashcards mode ===== -->
      <section id="cards-section">
        <div class="flip-scene mx-auto max-w-xl h-80 sm:h-72" id="flip-scene">
          <div class="flip-inner" id="flip-inner">
            <!-- Front -->
            <div class="flip-face card grid place-items-center p-8 text-center cursor-pointer select-none" id="card-front">
              <div>
                <p class="font-display font-bold text-3xl sm:text-4xl" id="word"><span class="skeleton inline-block w-40">&nbsp;</span></p>
                <p class="font-mono text-sm text-slate-400 mt-2" id="pronunciation"></p>
                <p class="text-xs text-slate-400 mt-6">Tap to reveal meaning</p>
              </div>
            </div>
            <!-- Back -->
            <div class="flip-face flip-back card p-6 sm:p-7 cursor-pointer select-none overflow-y-auto" id="card-back">
              <p class="font-semibold text-lg" id="back-word"></p>
              <p class="text-sm mt-2 text-slate-600 dark:text-slate-300" id="meaning"></p>
              <p class="text-sm mt-3 italic text-slate-500 dark:text-slate-400" id="example"></p>
              <div class="grid grid-cols-2 gap-3 mt-4 text-xs">
                <div><p class="font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wide mb-1">Synonyms</p><p id="synonyms" class="text-slate-500 dark:text-slate-400"></p></div>
                <div><p class="font-semibold text-rose-500 dark:text-rose-400 uppercase tracking-wide mb-1">Antonyms</p><p id="antonyms" class="text-slate-500 dark:text-slate-400"></p></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card controls -->
        <div class="max-w-xl mx-auto mt-5">
          <div class="flex items-center justify-between">
            <button id="prev-btn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-400 transition" aria-label="Previous word">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="flex items-center gap-2">
              <button id="bookmark-btn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-amber-400 transition" aria-label="Bookmark word"></button>
              <button id="status-learning" class="px-4 py-2.5 rounded-xl text-sm font-semibold border border-amber-300 dark:border-amber-700 text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/25 transition">Still learning</button>
              <button id="status-mastered" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white transition">I know this</button>
            </div>
            <button id="next-btn" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-400 transition" aria-label="Next word">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <p class="text-center text-xs text-slate-400 mt-3"><span id="card-position">–</span> · <span id="card-status" class="capitalize"></span></p>
        </div>

        <p id="cards-empty" class="hidden text-center text-sm text-slate-500 dark:text-slate-400 mt-10">
          No words match this filter yet. Bookmark words while you study and they'll collect here.
        </p>
      </section>

      <!-- ===== Quiz mode ===== -->
      <section id="quiz-section" class="hidden max-w-xl mx-auto">
        <div id="quiz-body"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/pages/vocabulary.js"></script>
</body>
</html>
